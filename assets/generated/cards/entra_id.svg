<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="106" viewBox="0 0 104 106">
  <defs>
    <!-- Top-to-bottom elevated face gradient -->
    <linearGradient id="tileFace_entra_id" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2232"/>
      <stop offset="45%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <!-- Subtle bottom bevel shadow for 3D extrusion -->
    <linearGradient id="bevelShadow_entra_id" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadows (Multi-Layer Elevation) -->
  <rect x="8" y="12" width="88" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <rect x="4" y="8" width="96" height="92" rx="13" fill="#000000" opacity="0.40"/>

  <!-- 2. Bottom 3D Extrusion Bevel (Physical Thickness Lip) -->
  <rect x="4" y="4" width="96" height="94" rx="12" fill="url(#bevelShadow_entra_id)" stroke="#0078d4" stroke-opacity="0.20" stroke-width="1"/>

  <!-- 3. Primary Elevated Card Face (Lifted 2px up) -->
  <rect x="4" y="2" width="96" height="92" rx="12" fill="url(#tileFace_entra_id)" stroke="#0078d4" stroke-opacity="0.70" stroke-width="1.4"/>

  <!-- 4. Inner Glass / Acrylic Chamfer Reflection -->
  <rect x="5.5" y="3.5" width="93" height="89" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 5. Top Specular Glass Highlight -->
  <path d="M 16 3.5 L 88 3.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 6.5 12 L 6.5 38" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>

  <!-- 6. Subtle Ambient Bottom Color Sheen -->
  <ellipse cx="52" cy="90" rx="32" ry="3.5" fill="#0078d4" opacity="0.32"/>
  <!-- Primary Expertise Gold Indicator with Radiant Halo -->
  <circle cx="87" cy="14" r="5.5" fill="#FFDB70" opacity="0.18"/>
  <circle cx="87" cy="14" r="3.5" fill="#FFDB70" opacity="0.45"/>
  <circle cx="87" cy="14" r="2" fill="#FFDB70"/>

  <!-- 7. Logo Container (with subtle drop shadow & brand glow) -->
  <g transform="translate(34, 18)">
    <circle cx="18" cy="18" r="19" fill="#0078d4" opacity="0.07"/>
    <ellipse cx="18" cy="34" rx="15" ry="3" fill="#000000" opacity="0.45"/>
    <svg width="36" height="36" viewBox="0 0 18 18" fill="#0078d4">
      <desc></desc><g><title>Microsoft Entra ID</title><defs><linearGradient id="definition-1" x1="7.697" x2="14.082" y1="12.409" y2="4.947" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#225086" /><stop offset="1" stop-color="#0055c5" /></linearGradient><linearGradient id="definition-2" x1="6.363" x2="6.363" y1="13.413" y2="-2.834" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6df" /><stop offset="1" stop-color="#0294e4" /></linearGradient><linearGradient id="definition-3" x1="9" x2="9" y1="15.621" y2="-3.267" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#44dbf9" /><stop offset="1" stop-color="#cbf8ff" /></linearGradient><linearGradient id="definition-4" x1="13.5" x2="13.5" y1="16.856" y2=".796" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#041642" /><stop offset="1" stop-color="#041642" stop-opacity=".25" /></linearGradient></defs><path fill="url(#definition-1)" d="m17.646 9.967-7.5-8.46a1.55 1.55 0 0 0-2.294 0L.353 9.967c-.579.654-.428 1.641.323 2.111l7.499 4.688c.5.313 1.148.313 1.648 0l7.499-4.688c.751-.469.902-1.457.323-2.111Z" /><path fill="url(#definition-2)" d="M10.147 1.507a1.55 1.55 0 0 0-2.294 0L.354 9.967c-.579.654-.428 1.641.323 2.111l3.126 1.954c.388.242 1.033.511 1.715.511.621 0 1.197-.18 1.676-.487l.002-.001L9 12.927l-4.364-2.728L9.11 5.152a3.05 3.05 0 0 1 2.302-1.026c.472 0 .917.107 1.314.292l-2.579-2.909Z" /><path fill="url(#definition-3)" d="m4.636 10.199.052.032L9 12.927l4.364-2.728h.001-.001L9 5.275z" /><path fill="url(#definition-4)" fill-opacity=".5" d="M9 17c.287 0 .574-.078.824-.234l7.499-4.688c.751-.469.902-1.457.323-2.111l-7.499-8.46A1.53 1.53 0 0 0 9 1z" opacity=".5" /></g>
    </svg>
  </g>

  <!-- 8. Crisp High-Contrast Typography Label -->
  <text x="52" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFEDB3" letter-spacing="-0.1">
    Entra ID
  </text>
</svg>
