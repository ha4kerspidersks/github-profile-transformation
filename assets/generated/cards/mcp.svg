<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="106" viewBox="0 0 104 106">
  <defs>
    <!-- Top-to-bottom elevated face gradient -->
    <linearGradient id="tileFace_mcp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2232"/>
      <stop offset="45%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <!-- Subtle bottom bevel shadow for 3D extrusion -->
    <linearGradient id="bevelShadow_mcp" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadows (Multi-Layer Elevation) -->
  <rect x="8" y="12" width="88" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <rect x="4" y="8" width="96" height="92" rx="13" fill="#000000" opacity="0.40"/>

  <!-- 2. Bottom 3D Extrusion Bevel (Physical Thickness Lip) -->
  <rect x="4" y="4" width="96" height="94" rx="12" fill="url(#bevelShadow_mcp)" stroke="#ec4899" stroke-opacity="0.20" stroke-width="1"/>

  <!-- 3. Primary Elevated Card Face (Lifted 2px up) -->
  <rect x="4" y="2" width="96" height="92" rx="12" fill="url(#tileFace_mcp)" stroke="#ec4899" stroke-opacity="0.42" stroke-width="1.1"/>

  <!-- 4. Inner Glass / Acrylic Chamfer Reflection -->
  <rect x="5.5" y="3.5" width="93" height="89" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 5. Top Specular Glass Highlight -->
  <path d="M 16 3.5 L 88 3.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 6.5 12 L 6.5 38" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>

  <!-- 6. Subtle Ambient Bottom Color Sheen -->
  <ellipse cx="52" cy="90" rx="32" ry="3.5" fill="#ec4899" opacity="0.20"/>

  <!-- 7. Logo Container (with subtle drop shadow & brand glow) -->
  <g transform="translate(34, 18)">
    <circle cx="18" cy="18" r="19" fill="#ec4899" opacity="0.07"/>
    <ellipse cx="18" cy="34" rx="15" ry="3" fill="#000000" opacity="0.45"/>
    <svg width="36" height="36" viewBox="0 0 128 128" fill="#ec4899">
      <defs>
    <linearGradient id="mcp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
  </defs>
  <polygon points="64,14 108,39 108,89 64,114 20,89 20,39" fill="#18181b" stroke="url(#mcp-grad)" stroke-width="4" stroke-linejoin="round"/>
  <circle cx="64" cy="64" r="14" fill="url(#mcp-grad)" stroke="#ffffff" stroke-width="2"/>
  <path d="M 64,28 L 64,50" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 94,48 L 76,58" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 94,80 L 76,70" stroke="#ec4899" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 64,100 L 64,78" stroke="#be185d" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 34,80 L 52,70" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 34,48 L 52,58" stroke="#f472b6" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="64" cy="28" r="4" fill="#ffffff"/>
  <circle cx="94" cy="48" r="4" fill="#ffffff"/>
  <circle cx="94" cy="80" r="4" fill="#ffffff"/>
  <circle cx="64" cy="100" r="4" fill="#ffffff"/>
  <circle cx="34" cy="80" r="4" fill="#ffffff"/>
  <circle cx="34" cy="48" r="4" fill="#ffffff"/>
    </svg>
  </g>

  <!-- 8. Crisp High-Contrast Typography Label -->
  <text x="52" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="-0.1">
    MCP
  </text>
</svg>
