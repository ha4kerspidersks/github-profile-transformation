<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="106" viewBox="0 0 104 106">
  <defs>
    <!-- Top-to-bottom elevated face gradient -->
    <linearGradient id="tileFace_agentic_ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2232"/>
      <stop offset="45%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <!-- Subtle bottom bevel shadow for 3D extrusion -->
    <linearGradient id="bevelShadow_agentic_ai" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadows (Multi-Layer Elevation) -->
  <rect x="8" y="12" width="88" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <rect x="4" y="8" width="96" height="92" rx="13" fill="#000000" opacity="0.40"/>

  <!-- 2. Bottom 3D Extrusion Bevel (Physical Thickness Lip) -->
  <rect x="4" y="4" width="96" height="94" rx="12" fill="url(#bevelShadow_agentic_ai)" stroke="#a855f7" stroke-opacity="0.20" stroke-width="1"/>

  <!-- 3. Primary Elevated Card Face (Lifted 2px up) -->
  <rect x="4" y="2" width="96" height="92" rx="12" fill="url(#tileFace_agentic_ai)" stroke="#a855f7" stroke-opacity="0.42" stroke-width="1.1"/>

  <!-- 4. Inner Glass / Acrylic Chamfer Reflection -->
  <rect x="5.5" y="3.5" width="93" height="89" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 5. Top Specular Glass Highlight -->
  <path d="M 16 3.5 L 88 3.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 6.5 12 L 6.5 38" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>

  <!-- 6. Subtle Ambient Bottom Color Sheen -->
  <ellipse cx="52" cy="90" rx="32" ry="3.5" fill="#a855f7" opacity="0.20"/>

  <!-- 7. Logo Container (with subtle drop shadow & brand glow) -->
  <g transform="translate(34, 18)">
    <circle cx="18" cy="18" r="19" fill="#a855f7" opacity="0.07"/>
    <ellipse cx="18" cy="34" rx="15" ry="3" fill="#000000" opacity="0.45"/>
    <svg width="36" height="36" viewBox="0 0 128 128" fill="#a855f7">
      <defs>
    <linearGradient id="agentic-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="20" fill="url(#agentic-grad)" stroke="#ffffff" stroke-width="2.5" />
  <circle cx="64" cy="64" r="10" fill="#ffffff" opacity="0.9" />
  <circle cx="64" cy="22" r="12" fill="#18181b" stroke="#c084fc" stroke-width="2.5" />
  <circle cx="64" cy="22" r="5" fill="#c084fc" />
  <circle cx="28" cy="94" r="12" fill="#18181b" stroke="#a855f7" stroke-width="2.5" />
  <circle cx="28" cy="94" r="5" fill="#a855f7" />
  <circle cx="100" cy="94" r="12" fill="#18181b" stroke="#7e22ce" stroke-width="2.5" />
  <circle cx="100" cy="94" r="5" fill="#7e22ce" />
  <line x1="64" y1="34" x2="64" y2="44" stroke="#c084fc" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" />
  <line x1="38" y1="84" x2="48" y2="74" stroke="#a855f7" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" />
  <line x1="90" y1="84" x2="80" y2="74" stroke="#7e22ce" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" />
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#agentic-grad)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
    </svg>
  </g>

  <!-- 8. Crisp High-Contrast Typography Label -->
  <text x="52" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="-0.1">
    Agentic AI
  </text>
</svg>
