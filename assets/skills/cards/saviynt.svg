<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="106" viewBox="0 0 104 106">
  <defs>
    <!-- Top-to-bottom elevated face gradient -->
    <linearGradient id="tileFace_saviynt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2232"/>
      <stop offset="45%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <!-- Subtle bottom bevel shadow for 3D extrusion -->
    <linearGradient id="bevelShadow_saviynt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadows (Multi-Layer Elevation) -->
  <rect x="8" y="12" width="88" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <rect x="4" y="8" width="96" height="92" rx="13" fill="#000000" opacity="0.40"/>

  <!-- 2. Bottom 3D Extrusion Bevel (Physical Thickness Lip) -->
  <rect x="4" y="4" width="96" height="94" rx="12" fill="url(#bevelShadow_saviynt)" stroke="#00f2fe" stroke-opacity="0.20" stroke-width="1"/>

  <!-- 3. Primary Elevated Card Face (Lifted 2px up) -->
  <rect x="4" y="2" width="96" height="92" rx="12" fill="url(#tileFace_saviynt)" stroke="#00f2fe" stroke-opacity="0.70" stroke-width="1.4"/>

  <!-- 4. Inner Glass / Acrylic Chamfer Reflection -->
  <rect x="5.5" y="3.5" width="93" height="89" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 5. Top Specular Glass Highlight -->
  <path d="M 16 3.5 L 88 3.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 6.5 12 L 6.5 38" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>

  <!-- 6. Subtle Ambient Bottom Color Sheen -->
  <ellipse cx="52" cy="90" rx="32" ry="3.5" fill="#00f2fe" opacity="0.32"/>
  <!-- Primary Expertise Gold Indicator with Radiant Halo -->
  <circle cx="87" cy="14" r="5.5" fill="#FFDB70" opacity="0.18"/>
  <circle cx="87" cy="14" r="3.5" fill="#FFDB70" opacity="0.45"/>
  <circle cx="87" cy="14" r="2" fill="#FFDB70"/>

  <!-- 7. Logo Container (with subtle drop shadow & brand glow) -->
  <g transform="translate(34, 18)">
    <circle cx="18" cy="18" r="19" fill="#00f2fe" opacity="0.07"/>
    <ellipse cx="18" cy="34" rx="15" ry="3" fill="#000000" opacity="0.45"/>
    <svg width="36" height="36" viewBox="-2 0 32 32" fill="#00f2fe">
      <path d="M21.0186 11.984L28.0137 8.03008L14.0028 0L7.04932 3.98762L21.0186 11.984Z" fill="#00f2fe"/>
  <path d="M14.0148 15.9429L0.0956832 7.97531L0 8.03014V15.8885L7.0109 19.9017L14.0148 15.9429Z" fill="#00d2fe"/>
  <path d="M20.98 27.8981L7.01081 19.9017L0.00683594 23.8606L14.0265 31.8857L20.98 27.8981Z" fill="#38bdf8"/>
  <path d="M14.0148 15.9429L27.9336 23.9105L28.0137 23.8645V15.9882L21.0186 11.984L14.0148 15.9429Z" fill="#0284c7"/>
    </svg>
  </g>

  <!-- 8. Crisp High-Contrast Typography Label -->
  <text x="52" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#FFEDB3" letter-spacing="-0.1">
    Saviynt
  </text>
</svg>
