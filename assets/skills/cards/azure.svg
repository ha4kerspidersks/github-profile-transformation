<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="104" height="106" viewBox="0 0 104 106">
  <defs>
    <!-- Top-to-bottom elevated face gradient -->
    <linearGradient id="tileFace_azure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B2232"/>
      <stop offset="45%" stop-color="#111622"/>
      <stop offset="100%" stop-color="#080B12"/>
    </linearGradient>
    <!-- Subtle bottom bevel shadow for 3D extrusion -->
    <linearGradient id="bevelShadow_azure" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#080B10"/>
      <stop offset="100%" stop-color="#030508"/>
    </linearGradient>
  </defs>

  <!-- 1. Ambient Drop Shadows (Multi-Layer Elevation) -->
  <rect x="8" y="12" width="88" height="88" rx="14" fill="#000000" opacity="0.62"/>
  <rect x="4" y="8" width="96" height="92" rx="13" fill="#000000" opacity="0.40"/>

  <!-- 2. Bottom 3D Extrusion Bevel (Physical Thickness Lip) -->
  <rect x="4" y="4" width="96" height="94" rx="12" fill="url(#bevelShadow_azure)" stroke="#0089d6" stroke-opacity="0.20" stroke-width="1"/>

  <!-- 3. Primary Elevated Card Face (Lifted 2px up) -->
  <rect x="4" y="2" width="96" height="92" rx="12" fill="url(#tileFace_azure)" stroke="#0089d6" stroke-opacity="0.42" stroke-width="1.1"/>

  <!-- 4. Inner Glass / Acrylic Chamfer Reflection -->
  <rect x="5.5" y="3.5" width="93" height="89" rx="10.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 5. Top Specular Glass Highlight -->
  <path d="M 16 3.5 L 88 3.5" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 6.5 12 L 6.5 38" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1" stroke-linecap="round"/>

  <!-- 6. Subtle Ambient Bottom Color Sheen -->
  <ellipse cx="52" cy="90" rx="32" ry="3.5" fill="#0089d6" opacity="0.20"/>

  <!-- 7. Logo Container (with subtle drop shadow & brand glow) -->
  <g transform="translate(34, 18)">
    <circle cx="18" cy="18" r="19" fill="#0089d6" opacity="0.07"/>
    <ellipse cx="18" cy="34" rx="15" ry="3" fill="#000000" opacity="0.45"/>
    <svg width="36" height="36" viewBox="0 0 128 128" fill="#0089d6">
      <defs><linearGradient id="azure-original-a" x1="60.919" y1="9.602" x2="18.667" y2="134.423" gradientUnits="userSpaceOnUse"><stop stop-color="#114A8B"/><stop offset="1" stop-color="#0669BC"/></linearGradient><linearGradient id="azure-original-b" x1="74.117" y1="67.772" x2="64.344" y2="71.076" gradientUnits="userSpaceOnUse"><stop stop-opacity=".3"/><stop offset=".071" stop-opacity=".2"/><stop offset=".321" stop-opacity=".1"/><stop offset=".623" stop-opacity=".05"/><stop offset="1" stop-opacity="0"/></linearGradient><linearGradient id="azure-original-c" x1="68.742" y1="5.961" x2="115.122" y2="129.525" gradientUnits="userSpaceOnUse"><stop stop-color="#3CCBF4"/><stop offset="1" stop-color="#2892DF"/></linearGradient></defs><path d="M46.09.002h40.685L44.541 125.137a6.485 6.485 0 01-6.146 4.413H6.733a6.482 6.482 0 01-5.262-2.699 6.474 6.474 0 01-.876-5.848L39.944 4.414A6.488 6.488 0 0146.09 0z" fill="url(#azure-original-a)" transform="translate(.587 4.468) scale(.91904)"/><path d="M97.28 81.607H37.987a2.743 2.743 0 00-1.874 4.751l38.1 35.562a5.991 5.991 0 004.087 1.61h33.574z" fill="#0078d4"/><path d="M46.09.002A6.434 6.434 0 0039.93 4.5L.644 120.897a6.469 6.469 0 006.106 8.653h32.48a6.942 6.942 0 005.328-4.531l7.834-23.089 27.985 26.101a6.618 6.618 0 004.165 1.519h36.396l-15.963-45.616-46.533.011L86.922.002z" fill="url(#azure-original-b)" transform="translate(.587 4.468) scale(.91904)"/><path d="M98.055 4.408A6.476 6.476 0 0091.917.002H46.575a6.478 6.478 0 016.137 4.406l39.35 116.594a6.476 6.476 0 01-6.137 8.55h45.344a6.48 6.48 0 006.136-8.55z" fill="url(#azure-original-c)" transform="translate(.587 4.468) scale(.91904)"/>
    </svg>
  </g>

  <!-- 8. Crisp High-Contrast Typography Label -->
  <text x="52" y="83" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#E2E8F0" letter-spacing="-0.1">
    Azure
  </text>
</svg>
